<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>College Search — TierCheck</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo" onclick="window.location.href='index.html'">
      <span class="logo-tc">TC</span>
      <span class="logo-text">TierCheck</span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="college.html" class="active">College Search</a></li>
      <li><a href="companies.html">Companies</a></li>
      <li><a href="jobs.html">Jobs</a></li>
      <li><a href="submit.html">Submit Data</a></li>
    </ul>
    <div class="nav-hamburger" onclick="toggleMenu()">&#9776;</div>
  </nav>

  <div class="page-header">
    <h1>🎓 College <span class="yellow">Tier Finder</span></h1>
    <p>Search 1000+ colleges ranked by tier — data powered by Supabase</p>
  </div>

  <div class="college-section">
    <div class="college-search-big" style="position:relative;">
      <input type="text" id="collegeInput" placeholder="Type your college name..." oninput="liveSearchCollege()" autocomplete="off"/>
      <button onclick="searchCollegePage()">Find Tier</button>
      <div id="suggestions" class="suggestions hidden"></div>
    </div>

    <div id="collegeResult" class="hidden"></div>
  </div>

  <footer class="footer">
    <div class="footer-logo"><span class="logo-tc">TC</span> TierCheck</div>
    <p>Know Your Chances. Save Your Time.</p>
    <p class="footer-small">© 2024 TierCheck. Supabase Production Backend.</p>
  </footer>

  <!-- Supabase Stack -->
  <script src="supabase-config.js"></script>
<script src="data-api.js"></script>
  <script src="data.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    let collegesCache = []; // Will load from Supabase

    async function loadColleges() {
      try {
        collegesCache = await window.api.fetchColleges('');
        console.log(`Loaded ${collegesCache.length} colleges from Supabase`);
      } catch (e) {
        collegesCache = window.colleges || [];
        console.log(`Using fallback colleges (${collegesCache.length})`);
      }
    }

    // Load on start
    loadColleges().then(() => {
      console.log('College search ready');
    });

    const uniqueColleges = () => collegesCache.filter((c, i, arr) =>
      arr.findIndex(x => x.name.toLowerCase() === c.name.toLowerCase()) === i
    );

    function liveSearchCollege() {
      const input = document.getElementById('collegeInput').value.toLowerCase();
      const suggestionsBox = document.getElementById('suggestions');
      if (!input || input.length < 2) { 
        suggestionsBox.classList.add('hidden'); 
        return; 
      }
      const matches = uniqueColleges().filter(c => c.name.toLowerCase().includes(input));
      if (matches.length === 0) { 
        suggestionsBox.classList.add('hidden'); 
        return; 
      }
      suggestionsBox.innerHTML = matches.map(c =>
        `<div data-name="${c.name.replace(/"/g, '"')}" onclick="selectCollege(this.dataset.name)">${c.name} (${c.tierInfo?.label || 'Tier ' + c.tier})</div>`
      ).join('');
      suggestionsBox.classList.remove('hidden');
    }

    function selectCollege(name) {
      document.getElementById('collegeInput').value = name;
      document.getElementById('suggestions').classList.add('hidden');
      searchCollegePage();
    }

    async function searchCollegePage() {
      const input = document.getElementById('collegeInput').value.trim().toLowerCase();
      const resultDiv = document.getElementById('collegeResult');
      if (!input) return;
      
      const colleges = await window.api.fetchColleges(input);
      const found = colleges[0];
      
      if (!found) {
        resultDiv.className = 'college-result-box error';
        resultDiv.innerHTML = `<h2>College not found</h2><p>Try a different spelling or name. ${colleges.length} similar colleges found.</p>`;
        resultDiv.classList.remove('hidden');
        return;
      }
      
      const info = found.tierInfo || window.tierInfo[found.tier] || window.tierInfo[3];
      resultDiv.className = 'college-result-box';
      resultDiv.innerHTML = `
        <h2>${found.name}</h2>
        <div class="big-tier ${info.color}">${info.label}</div>
        <p>${info.desc}</p>
        <div class="companies-for-tier">
          <h3>Companies hiring from your tier:</h3>
          <div class="mini-company-list">
            ${info.companies.slice(0,8).map(c => `<span class="mini-company-tag">${c}</span>`).join('')}
          </div>
        </div>
        <div style="margin-top:20px">
          <a href="companies.html" class="btn">See All Companies →</a>
          <a href="jobs.html" class="btn secondary">Live Jobs →</a>
        </div>
      `;
      resultDiv.classList.remove('hidden');
    }

    document.getElementById('collegeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchCollegePage();
    });
  </script>
</body>
</html>
