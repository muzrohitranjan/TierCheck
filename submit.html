<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Submit Data | TierCheck</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo" onclick="window.location.href='index.html'">
      <span class="logo-tc">TC</span>
      <span class="logo-text">TierCheck</span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="college.html">College Search</a></li>
      <li><a href="companies.html">Companies</a></li>
      <li><a href="jobs.html">Jobs</a></li>
      <li><a href="submit.html" class="active">Submit Data</a></li>
    </ul>
    <div class="nav-hamburger" onclick="toggleMenu()">☰</div>
  </nav>

  <div class="page-header">
    <h1>Submit <span class="yellow">Your Data</span></h1>
<p></p>Help improve TierCheck accuracy. Data saved directly to Supabase. Anonymous and reviewed.</p>
  </div>

  <div class="submit-section">
    <form class="submit-form" onsubmit="submitData(event)">
      <div class="form-group">
        <label>Your College Name</label>
        <input type="text" id="s_college" placeholder="e.g. IIT Bombay" required/>
      </div>
      <div class="form-group">
        <label>College Tier</label>
        <select id="s_tier" required>
          <option value="" disabled selected>Select tier</option>
          <option value="1">Tier 1</option>
          <option value="2">Tier 2</option>
          <option value="3">Tier 3</option>
          <option value="4">Tier 4</option>
        </select>
      </div>
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" id="s_company" placeholder="e.g. Google" required/>
      </div>
      <div class="form-group">
        <label>Role/Position</label>
        <input type="text" id="s_role" placeholder="e.g. SDE, Intern" required/>
      </div>
      <div class="form-group">
        <label>Year</label>
        <select id="s_year" required>
          <option value="" disabled selected>Year</option>
          <option>2025</option><option>2024</option><option>2023</option>
        </select>
      </div>
      <button type="submit" class="submit-btn">Submit to Supabase</button>
      <div id="successMsg" class="success-msg hidden"></div>
      <div id="errorMsg" class="error-msg hidden"></div>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-logo"><span class="logo-tc">TC</span> TierCheck</div>
   <p>Know Your Chances. Save Your Time.</p>
    <p class="footer-small">2025 Data helps everyone<br>All rights reserved<br></p>
  </footer>

  <!-- Supabase Submit -->
  <script src="supabase-config.js"></script>
<script src="data-api.js"></script>
  <!-- REMOVED data.js - Pure Supabase -->
  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    async function submitData(e) {
      e.preventDefault();
      const formData = {
        college: document.getElementById('s_college').value,
        tier: parseInt(document.getElementById('s_tier').value),
        company: document.getElementById('s_company').value,
        role: document.getElementById('s_role').value,
        year: document.getElementById('s_year').value
      };
      
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      try {
        const submitted = await window.api.submitData(formData);
        if (submitted) {
          successMsg.textContent = 'Data saved to Supabase! Thank you';
          successMsg.classList.remove('hidden');
          errorMsg.classList.add('hidden');
          document.querySelector('.submit-form').reset();
        } else {
          throw new Error('Submit failed');
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Data saved locally.';
        errorMsg.classList.remove('hidden');
        successMsg.classList.add('hidden');
        console.error('Supabase submit error:', err);
      }
    }
  </script>
</body>
</html>
